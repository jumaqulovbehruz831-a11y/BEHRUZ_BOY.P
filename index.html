<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maxfiy Do'stlar Chati</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: white; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; }
        #login-screen { background: #1e1e1e; padding: 30px; border-radius: 15px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        input { padding: 12px; border-radius: 8px; border: none; margin: 5px; width: 80%; background: #333; color: white; }
        button { padding: 12px 25px; border-radius: 8px; border: none; background: #0088cc; color: white; cursor: pointer; font-weight: bold; }
        #chat-container { display: none; width: 100%; max-width: 500px; height: 90vh; background: #1e1e1e; flex-direction: column; border-radius: 15px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        #chat-box { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { background: #252525; padding: 10px; border-radius: 10px; max-width: 80%; word-wrap: break-word; align-self: flex-start; border: 1px solid #333; }
        .msg b { color: #00fbff; display: block; font-size: 0.85em; margin-bottom: 3px; }
        #input-area { padding: 15px; background: #1a1a1a; display: flex; gap: 10px; border-top: 1px solid #252525; }
        #message-input { flex: 1; }
    </style>
</head>
<body>

    <div id="login-screen">
        <h2>Maxfiy Chatga Kirish</h2>
        <input type="text" id="user-name" placeholder="Ismingizni yozing..."><br>
        <input type="password" id="chat-pass" placeholder="Maxfiy kodni kiriting..."><br>
        <button onclick="checkAccess()">Kirish</button>
        <p id="error" style="color: #ff4d4d; display: none; font-weight: bold; margin-top: 10px;">Kod noto'g'ri!</p>
    </div>

    <div id="chat-container">
        <div style="background: #0088cc; padding: 15px; text-align: center; font-weight: bold; font-size: 1.2em; letter-spacing: 1px;">DO'STLAR CHATI</div>
        <div id="chat-box"></div>
        <div id="input-area">
            <input type="text" id="message-input" placeholder="Xabar yozing...">
            <button onclick="sendMessage()">Yuborish</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script>
        // Sening shaxsiy Firebase ma'lumotlaring tayyor qilib joylandi:
        const firebaseConfig = {
            apiKey: "AIzaSyBOF8dOWfCUJHBPChgXIRrmvv374Lkv8Y8",
            databaseURL: "https://special-chat-a2ded-default-rtdb.firebaseio.com",
            projectId: "special-chat-a2ded",
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const SECRET_CODE = "2026"; // Chatga kirish kodi
        let currentUsername = "";

        function checkAccess() {
            const pass = document.getElementById('chat-pass').value;
            const name = document.getElementById('user-name').value;
            
            if (pass === SECRET_CODE && name.trim() !== "") {
                currentUsername = name;
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('chat-container').style.display = 'flex';
                loadMessages();
            } else {
                document.getElementById('error').style.display = 'block';
            }
        }

        function sendMessage() {
            const text = document.getElementById('message-input').value;
            if (text.trim() !== "") {
                db.ref('global_chat').push().set({
                    sender: currentUsername,
                    message: text,
                    time: Date.now()
                });
                document.getElementById('message-input').value = "";
            }
        }

        function loadMessages() {
            db.ref('global_chat').limitToLast(50).on('child_added', (data) => {
                const val = data.val();
                const chatBox = document.getElementById('chat-box');
                const msgDiv = document.createElement('div');
                msgDiv.className = 'msg';
                msgDiv.innerHTML = `<b>${val.sender}</b> ${val.message}`;
                chatBox.appendChild(msgDiv);
                chatBox.scrollTop = chatBox.scrollHeight;
            });
        }

        // Enter tugmasini bosganda xabar yuborish
        document.getElementById("message-input").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Premium Chat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: '-apple-system', BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #000000; color: white; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        
        /* Kirish oynasi */
        #login-screen { background: #121212; padding: 40px; border-radius: 15px; text-align: center; border: 1px solid #262626; width: 90%; max-width: 400px; }
        .insta-logo { font-style: italic; font-size: 2.2rem; font-weight: bold; margin-bottom: 30px; background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        input { padding: 14px; border-radius: 8px; border: 1px solid #363636; margin: 8px 0; width: 100%; background: #1c1c1e; color: white; outline: none; font-size: 0.95rem; }
        input:focus { border-color: #a307fa; }
        button { padding: 14px 25px; border-radius: 8px; border: none; background: #0095f6; color: white; cursor: pointer; font-weight: bold; width: 100%; font-size: 0.95rem; transition: 0.2s; }
        button:hover { background: #1877f2; }
        
        /* Chat interfeysi */
        #chat-container { display: none; width: 100%; max-width: 600px; height: 95vh; background: #000000; flex-direction: column; border-radius: 20px; overflow: hidden; border: 1px solid #262626; position: relative; background-size: cover; background-position: center; }
        
        /* Instagram uslubidagi Header */
        #chat-header { background: rgba(0, 0, 0, 0.85); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #262626; backdrop-filter: blur(10px); z-index: 5; }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .online-dot { width: 10px; height: 10px; background: #4cd964; border-radius: 50%; box-shadow: 0 0 8px #4cd964; }
        .header-title { font-weight: 600; font-size: 1.1rem; }
        
        /* Orqa fonni o'zgartirish tugmasi */
        .bg-btn { background: #262626; color: #fff; padding: 8px 12px; border-radius: 20px; font-size: 0.8rem; width: auto; font-weight: 500; }
        
        /* Chat xabarlar oynasi */
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 8px; background: rgba(0, 0, 0, 0.2); }
        
        /* Instagram xabarlar dizayni */
        .msg { padding: 12px 16px; border-radius: 20px; max-width: 70%; word-wrap: break-word; align-self: flex-start; background: #262626; position: relative; animation: pop 0.2s ease-out; font-size: 0.95rem; line-height: 1.4; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .msg.my-msg { align-self: flex-end; background: linear-gradient(45deg, #b224ef, #7579ff); }
        .msg b { display: block; font-size: 0.75em; opacity: 0.6; margin-bottom: 3px; }
        
        /* Instagram funksiyalari (Layk va O'chirish) */
        .msg-actions { display: flex; gap: 10px; margin-top: 5px; font-size: 0.75rem; opacity: 0.7; }
        .like-btn { cursor: pointer; color: #ff3b30; background: none; border: none; width: auto; padding: 0; display: inline; font-size: 0.8rem; }
        .del-btn { cursor: pointer; color: #8e8e93; background: none; border: none; width: auto; padding: 0; display: inline; }
        .likes-count { color: #ff3b30; font-weight: bold; margin-left: 2px; }
        
        /* Multimedia elementlari */
        .chat-img { max-width: 100%; max-height: 250px; border-radius: 12px; margin-top: 5px; display: block; border: 1px solid #363636; }
        .chat-link { color: #0095f6; text-decoration: none; word-break: break-all; }
        .msg.my-msg .chat-link { color: #fff; text-decoration: underline; }
        audio { margin-top: 5px; max-width: 100%; filter: invert(1); }

        /* Pastki yozish qismi */
        #input-area { padding: 15px 20px; background: rgba(0, 0, 0, 0.95); display: flex; gap: 10px; border-top: 1px solid #262626; align-items: center; }
        #message-input { flex: 1; margin: 0; border-radius: 25px; padding: 12px 20px; border: 1px solid #363636; background: #000; }
        .action-btn { width: auto; background: none; font-size: 1.3rem; padding: 5px; }
        #send-btn { width: auto; color: #0095f6; background: none; font-size: 1rem; padding: 5px 10px; text-transform: none; }
        #rec-btn.recording { color: #ff3b30; animation: blink 1s infinite; }

        @keyframes pop { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes blink { 50% { opacity: 0.5; } }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #262626; border-radius: 10px; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="insta-logo">Instagram Direct</div>
        <input type="text" id="user-name" placeholder="Foydalanuvchi nomi...">
        <input type="password" id="chat-pass" placeholder="Parol...">
        <button onclick="checkAccess()">Kirish</button>
        <p id="error" style="color: #ff3b30; display: none; margin-top: 15px; font-size: 0.9rem;">Parol noto'g'ri!</p>
    </div>

    <div id="chat-container">
        <div id="chat-header">
            <div class="user-info">
                <div class="online-dot"></div>
                <div class="header-title">Do'stlar Guruhi</div>
            </div>
            <button class="bg-btn" onclick="changeBackground()">Fonni o'zgartirish 🖼️</button>
        </div>
        
        <div id="chat-box"></div>

        <div id="input-area">
            <button class="action-btn" id="rec-btn" onclick="toggleRecording()">🎙️</button>
            <input type="text" id="message-input" placeholder="Xabar yozing...">
            <button id="send-btn" onclick="sendMessage()">Yuborish</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBOF8dOWfCUJHBPChgXIRrmvv374Lkv8Y8",
            databaseURL: "https://special-chat-a2ded-default-rtdb.firebaseio.com",
            projectId: "special-chat-a2ded",
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const SECRET_CODE = "2026";
        let currentUsername = "";
        let mediaRecorder;
        let audioChunks = [];

        function checkAccess() {
            const pass = document.getElementById('chat-pass').value;
            const name = document.getElementById('user-name').value;
            if (pass === SECRET_CODE && name.trim() !== "") {
                currentUsername = name.trim();
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('chat-container').style.display = 'flex';
                
                // Saqlangan fonni yuklash
                const savedBg = localStorage.getItem('chat_bg');
                if(savedBg) document.getElementById('chat-container').style.backgroundImage = `url('${savedBg}')`;
                
                loadMessages();
            } else {
                document.getElementById('error').style.display = 'block';
            }
        }

        // Fon rasmini o'zgartirish funksiyasi
        function changeBackground() {
            const bgUrl = prompt("Orqa fon uchun rasm linkini (URL) kiriting:\n(Masalan, Google'dan biror chiroyli BMW yoki neon rasm havolasi)");
            if (bgUrl) {
                document.getElementById('chat-container').style.backgroundImage = `url('${bgUrl}')`;
                localStorage.setItem('chat_bg', bgUrl); // Brauzer eslab qolishi uchun
            }
        }

        function formatMessage(text) {
            if (text.startsWith('data:audio')) {
                return `<audio src="${text}" controls></audio>`;
            }
            const imgRegex = /(https?:\/\/.*\.(?:png|jpg|jpeg|gif|webp))/i;
            const urlRegex = /(https?:\/\/[^\s]+)/g;

            if (imgRegex.test(text)) {
                return text.replace(imgRegex, (url) => `<img src="${url}" class="chat-img" alt="Rasm">`);
            } else if (urlRegex.test(text)) {
                return text.replace(urlRegex, (url) => `<a href="${url}" target="_blank" class="chat-link">${url}</a>`);
            }
            return text;
        }

        function sendMessage() {
            const text = document.getElementById('message-input').value;
            if (text.trim() !== "") {
                db.ref('global_chat').push().set({
                    sender: currentUsername,
                    message: text,
                    time: Date.now(),
                    likes: 0
                });
                document.getElementById('message-input').value = "";
            }
        }

        function deleteMessage(key) {
            if(confirm("Ushbu xabarni o'chirishni xohlaysizmi?")) {
                db.ref('global_chat/' + key).remove();
            }
        }

        function likeMessage(key, currentLikes) {
            const likes = currentLikes ? currentLikes + 1 : 1;
            db.ref('global_chat/' + key).update({ likes: likes });
        }

        function loadMessages() {
            db.ref('global_chat').on('value', (snapshot) => {
                const chatBox = document.getElementById('chat-box');
                chatBox.innerHTML = "";
                
                snapshot.forEach((childSnapshot) => {
                    const key = childSnapshot.key;
                    const val = childSnapshot.val();
                    const msgDiv = document.createElement('div');
                    
                    const isMe = (val.sender === currentUsername);
                    msgDiv.className = isMe ? 'msg my-msg' : 'msg';
                    
                    const likesCount = val.likes ? `<span class="likes-count">❤️ ${val.likes}</span>` : '';
                    const deleteOption = isMe ? `<button class="del-btn" onclick="deleteMessage('${key}')">O'chirish</button>` : '';

                    msgDiv.innerHTML = `
                        <b>${val.sender}</b>
                        <div>${formatMessage(val.message)}</div>
                        <div class="msg-actions">
                            <button class="like-btn" onclick="likeMessage('${key}', ${val.likes || 0})">❤️ Like</button>
                            ${likesCount}
                            ${deleteOption}
                        </div>
                    `;
                    
                    chatBox.appendChild(msgDiv);
                });
                chatBox.scrollTop = chatBox.scrollHeight;
            });
        }

        async function toggleRecording() {
            const recBtn = document.getElementById('rec-btn');
            if (!mediaRecorder || mediaRecorder.state === "inactive") {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                mediaRecorder.ondataavailable = event => audioChunks.push(event.data);
                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
                    const reader = new FileReader();
                    reader.readAsDataURL(audioBlob);
                    reader.onloadend = () => {
                        db.ref('global_chat').push().set({
                            sender: currentUsername,
                            message: reader.result,
                            time: Date.now(),
                            likes: 0
                        });
                    };
                };
                mediaRecorder.start();
                recBtn.classList.add('recording');
                recBtn.innerText = "🛑";
            } else {
                mediaRecorder.stop();
                recBtn.classList.remove('recording');
                recBtn.innerText = "🎙️";
            }
        }

        document.getElementById("message-input").addEventListener("keypress", function(event) {
            if (event.key === "Enter") sendMessage();
        });
    </script>
</body>
</html>

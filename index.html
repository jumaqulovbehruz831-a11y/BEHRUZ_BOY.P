<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber-X Ultra Chat v9.5</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #010409; color: white; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; position: relative; }
        
        /* 🌌 Kiber-Atmosfera Tuman Animatsiyasi */
        body::before, body::after {
            content: '';
            position: absolute;
            width: 40%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            filter: blur(50px);
            opacity: 0.8;
            background: radial-gradient(circle at center, rgba(0, 251, 255, 0.15) 0%, rgba(163, 7, 250, 0.1) 40%, rgba(0, 0, 0, 0) 70%);
        }
        body::before { left: -10%; animation: kiberTuman 8s infinite alternate ease-in-out; }
        body::after { right: -10%; animation: kiberTuman 10s infinite alternate-reverse ease-in-out; }

        @keyframes kiberTuman {
            0% { transform: translate(-20px, -10px) scale(1); opacity: 0.6; }
            50% { transform: translate(10px, 20px) scale(1.1); opacity: 0.9; }
            100% { transform: translate(-10px, -20px) scale(1.05); opacity: 0.7; }
        }

        .cyber-line {
            position: absolute;
            background: linear-gradient(to bottom, transparent, rgba(0, 251, 255, 0.8), transparent);
            width: 2px;
            pointer-events: none;
            opacity: 0;
            z-index: 1;
        }

        /* Kirish oynasi */
        #login-screen { background: rgba(10, 15, 30, 0.95); padding: 40px; border-radius: 24px; text-align: center; box-shadow: 0 0 40px rgba(0, 251, 255, 0.25); border: 1px solid #00fbff; width: 90%; max-width: 400px; animation: zoomIn 0.3s ease-out; position: relative; z-index: 10; }
        h2 { font-size: 2rem; margin-bottom: 25px; color: #00fbff; text-shadow: 0 0 15px rgba(0, 251, 255, 0.4); letter-spacing: 2px; font-weight: 900; }
        input[type="text"], input[type="password"] { padding: 14px 18px; border-radius: 12px; border: 1px solid #1f2d4a; margin: 10px 0; width: 100%; background: #0f172a; color: white; outline: none; transition: 0.3s; font-size: 1rem; }
        input:focus { border-color: #00fbff; box-shadow: 0 0 12px rgba(0, 251, 255, 0.3); }
        .enter-btn { padding: 14px; border-radius: 12px; border: none; background: linear-gradient(45deg, #0055ff, #a307fa); color: white; cursor: pointer; font-weight: bold; width: 100%; font-size: 1rem; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 4px 15px rgba(0, 85, 255, 0.4); transition: 0.2s; }
        
        /* Chat tuzilishi */
        #chat-container { display: none; width: 100%; max-width: 900px; height: 95vh; background: #090d16; flex-direction: column; border-radius: 24px; overflow: hidden; box-shadow: 0 25px 60px rgba(0,0,0,0.8); border: 1px solid #1e293b; position: relative; background-size: cover; background-position: center; transition: background 0.5s ease; z-index: 5; }
        
        /* Header paneli */
        #chat-header { background: rgba(15, 23, 42, 0.85); padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; backdrop-filter: blur(20px); z-index: 10; }
        .header-main { display: flex; flex-direction: column; gap: 2px; }
        .status-box { display: flex; align-items: center; gap: 8px; }
        .online-dot { width: 10px; height: 10px; background: #39ff14; border-radius: 50%; box-shadow: 0 0 10px #39ff14; }
        .typing-status { font-size: 0.85rem; color: #00fbff; font-style: italic; min-height: 18px; display: flex; align-items: center; gap: 5px; }
        
        /* Ovoz yozish statusi */
        .voice-rec-status { color: #ef4444; font-weight: bold; animation: blink 1s infinite; display: none; }

        .header-buttons { display: flex; gap: 10px; align-items: center; }
        .bg-menu-btn { background: #1e293b; color: #00fbff; padding: 10px 16px; border-radius: 14px; font-size: 0.85rem; font-weight: 600; border: 1px solid #334155; cursor: pointer; transition: 0.2s; }
        
        /* Fonlar galereyasi */
        #bg-gallery { display: none; position: absolute; top: 75px; right: 25px; background: rgba(15, 23, 42, 0.95); border: 1px solid #00fbff; padding: 15px; border-radius: 20px; width: 320px; grid-template-columns: repeat(2, 1fr); gap: 12px; box-shadow: 0 15px 40px rgba(0,0,0,0.6); z-index: 20; backdrop-filter: blur(10px); animation: slideUp 0.2s ease-out; max-height: 400px; overflow-y: auto; }
        .bg-thumb { height: 80px; border-radius: 12px; cursor: pointer; border: 2px solid transparent; background-size: cover; background-position: center; transition: 0.25s ease; position: relative; overflow: hidden; }
        .bg-thumb:hover { border-color: #00fbff; transform: scale(1.04); }
        .bg-thumb span { position: absolute; bottom: 0; left: 0; right: 0; font-size: 0.7rem; background: rgba(0,0,0,0.75); padding: 4px; text-align: center; color: #00fbff; }

        /* Xabarlar oynasi */
        #chat-box { flex: 1; overflow-y: auto; padding: 25px; display: flex; flex-direction: column; gap: 12px; background: rgba(3, 7, 18, 0.2); scroll-behavior: smooth; }
        
        /* Premium Xabar dizaynlari */
        .msg { background: #1e293b; padding: 12px 16px; border-radius: 16px 16px 16px 4px; max-width: 70%; word-wrap: break-word; align-self: flex-start; border: 1px solid #334155; position: relative; animation: msgIn 0.25s cubic-bezier(0.1, 0.8, 0.3, 1) forwards; transition: opacity 0.25s, transform 0.25s; }
        .msg.my-msg { align-self: flex-end; background: linear-gradient(135deg, #0055ff, #a307fa); border: none; border-radius: 16px 16px 4px 16px; box-shadow: 0 4px 12px rgba(0, 85, 255, 0.3); }
        .msg b { color: #00fbff; display: block; font-size: 0.85em; margin-bottom: 5px; text-transform: capitalize; }
        .msg.my-msg b { color: #ffffff; opacity: 0.9; }
        
        /* Reply qismi xabar ichida */
        .reply-in-msg { background: rgba(0, 0, 0, 0.25); border-left: 3px solid #00fbff; padding: 6px 10px; border-radius: 4px; font-size: 0.82rem; margin-bottom: 6px; color: #cbd5e1; }
        .msg.my-msg .reply-in-msg { border-left-color: #fff; background: rgba(255,255,255,0.15); color: #fff; }

        /* Xabar asboblari (Like, Reply, Delete) */
        .msg-tools { display: flex; gap: 12px; margin-top: 8px; font-size: 0.75rem; opacity: 0.7; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 6px; }
        .tool-btn { background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 0.75rem; padding: 0; width: auto; font-family: inherit; }
        .tool-btn:hover { color: #00fbff; text-decoration: underline; }
        .tool-btn.del-btn { color: #f43f5e; }

        /* Reply Preview paneli */
        .reply-preview-bar { display: none; background: #1e293b; padding: 10px 15px; border-radius: 12px; justify-content: space-between; align-items: center; border-left: 4px solid #00fbff; margin-bottom: 5px; animation: slideUp 0.2s ease; }

        /* Console */
        #input-area { padding: 15px 20px; background: #090d16; display: flex; flex-direction: column; gap: 8px; border-top: 1px solid #1e293b; z-index: 10; }
        .telegram-console { display: flex; align-items: flex-end; background: #0e121f; border: 1px solid #1e293b; border-radius: 25px; padding: 5px 15px; width: 100%; transition: border-color 0.2s; }
        .telegram-console:focus-within { border-color: #00fbff; box-shadow: 0 0 8px rgba(0, 251, 255, 0.2); }
        
        #message-input { flex: 1; background: transparent; border: none; color: white; padding: 10px 12px; outline: none; font-size: 0.95rem; resize: none; max-height: 120px; font-family: inherit; }
        .console-btn { background: none; border: none; color: #94a3b8; font-size: 1.35rem; cursor: pointer; padding: 8px; display: flex; align-items: center; justify-content: center; transition: 0.2s; width: auto; height: 38px; }
        .console-btn:hover { color: #00fbff; transform: scale(1.1); }
        
        .send-btn { color: #38bdf8; display: none; animation: fadeIn 0.2s ease; }
        .send-btn:hover { color: #00fbff; }

        #rec-btn.recording { color: #ef4444; animation: voicePulse 1s infinite; }

        .chat-img { max-width: 100%; max-height: 280px; border-radius: 12px; margin-top: 6px; display: block; border: 1px solid rgba(255,255,255,0.1); }
        audio { margin-top: 6px; max-width: 100%; outline: none; display: block; }

        /* Animatsiyalar */
        @keyframes msgIn { from { opacity: 0; transform: translateY(12px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes zoomIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes blink { 50% { opacity: 0.3; } }
        @keyframes voicePulse { 0% { transform: scale(1); } 50% { transform: scale(1.15); opacity: 0.6; } 100% { transform: scale(1); } }
        
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="cyber-line" style="top: 10%; left: 15%; height: 60px; animation: cyberLineShot 3s infinite 0.5s;"></div>
    <div class="cyber-line" style="top: 40%; right: 20%; height: 80px; animation: cyberLineShot 4s infinite 1.5s;"></div>

    <style>
        @keyframes cyberLineShot {
            0% { opacity: 0; transform: translateY(-50px); }
            10% { opacity: 0.8; }
            50% { opacity: 0; transform: translateY(50px); }
            100% { opacity: 0; transform: translateY(50px); }
        }
    </style>

    <div id="login-screen">
        <h2>CYBER SYSTEM</h2>
        <input type="text" id="user-name" placeholder="Ismingiz...">
        <input type="password" id="chat-pass" placeholder="Xavfsizlik kodi...">
        <button class="enter-btn" onclick="checkAccess()">Tizimni Yoqish</button>
        <p id="error" style="color: #ef4444; display: none; margin-top: 15px; font-weight: bold;">Noto'g'ri kod!</p>
    </div>

    <div id="chat-container">
        <div id="chat-header">
            <div class="header-main">
                <div class="status-box">
                    <div class="online-dot"></div>
                    <div class="header-title">CYBER GLOBAL CORE</div>
                </div>
                <div class="typing-status" id="typing-txt"></div>
                <div class="voice-rec-status" id="voice-status">🎙️ Ovoz yozilmoqda...</div>
            </div>
            
            <div class="header-buttons">
                <button class="bg-menu-btn" style="background: #f43f5e; color: white; border-color: #f43f5e;" onclick="clearAllMessages()">Tozalash 🗑️</button>
                <button class="bg-menu-btn" onclick="toggleBgMenu()">Fonlar 🖼️</button>
            </div>
            
            <div id="bg-gallery">
                <div class="bg-thumb" style="background-image: url('https://images.unsplash.com/photo-1617814076367-b759c7d7e738?q=80&w=600');" onclick="setBg('https://images.unsplash.com/photo-1617814076367-b759c7d7e738?q=80&w=600')"><span>BMW M5 Neon</span></div>
                <div class="bg-thumb" style="background-image: url('https://images.unsplash.com/photo-1618843479313-40f8afb4b4d8?q=80&w=600');" onclick="setBg('https://images.unsplash.com/photo-1618843479313-40f8afb4b4d8?q=80&w=600')"><span>BMW Dark Sport</span></div>
                <div class="bg-thumb" style="background-image: url('https://images.unsplash.com/photo-1578894381163-e72c17f2d45f?q=80&w=600');" onclick="setBg('https://images.unsplash.com/photo-1578894381163-e72c17f2d45f?q=80&w=600')"><span>Cyberpunk City</span></div>
                <div class="bg-thumb" style="background-image: url('https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=600');" onclick="setBg('https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=600')"><span>Gaming Core</span></div>
                <div class="bg-thumb" style="background-image: url('https://images.unsplash.com/photo-1506318137071-a8e063b4bec0?q=80&w=600');" onclick="setBg('https://images.unsplash.com/photo-1506318137071-a8e063b4bec0?q=80&w=600')"><span>Deep Cosmos</span></div>
            </div>
        </div>
        
        <div id="chat-box"></div>

        <div id="input-area">
            <div class="reply-preview-bar" id="reply-preview-bar">
                <div id="reply-preview-text" style="font-size:0.85rem; color:#cbd5e1;"></div>
                <span style="cursor:pointer; color:#f43f5e; font-weight:bold;" onclick="cancelReply()">❌</span>
            </div>

            <div class="telegram-console">
                <button class="console-btn">📎</button>
                <textarea id="message-input" rows="1" placeholder="Xabar yozing..." oninput="handleInput(this)"></textarea>
                <button class="console-btn">😊</button>
                
                <button class="console-btn send-btn" id="send-btn" onclick="sendMessage()">🚀</button>
                <button class="console-btn" id="rec-btn" onclick="toggleRecording()">🎙️</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getDatabase, ref, push, set, onValue, remove, update } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBOF8dOWfCUJHBPChgXIRrmvv374Lkv8Y8",
            databaseURL: "https://special-chat-a2ded-default-rtdb.firebaseio.com",
            projectId: "special-chat-a2ded",
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const SECRET_CODE = "2026";
        const CLEAR_CODE = "3102"; // 🔑 Tozalash kodi sening xohishingdek 3102 bo'ldi!
        
        let currentUsername = "";
        let mediaRecorder;
        let audioChunks = [];
        let activeReplyId = null;
        let activeReplyText = "";
        const notificationSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2357/2357-84.wav');

        window.checkAccess = function() {
            if (document.getElementById('chat-pass').value === SECRET_CODE && document.getElementById('user-name').value.trim() !== "") {
                currentUsername = document.getElementById('user-name').value.trim();
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('chat-container').style.display = 'flex';
                
                const savedBg = localStorage.getItem('cyber_chat_bg');
                if (savedBg) document.getElementById('chat-container').style.backgroundImage = `url('${savedBg}')`;
                
                loadMessages();
            } else {
                document.getElementById('error').style.display = 'block';
            }
        }

        window.toggleBgMenu = function() {
            const menu = document.getElementById('bg-gallery');
            menu.style.display = menu.style.display === 'grid' ? 'none' : 'grid';
        }

        window.setBg = function(url) {
            document.getElementById('chat-container').style.backgroundImage = `url('${url}')`;
            localStorage.setItem('cyber_chat_bg', url);
            toggleBgMenu();
        }

        window.handleInput = function(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
            
            const sendBtn = document.getElementById('send-btn');
            const recBtn = document.getElementById('rec-btn');
            
            if (textarea.value.trim() !== "") {
                sendBtn.style.display = 'flex';
                recBtn.style.display = 'none';
            } else {
                sendBtn.style.display = 'none';
                recBtn.style.display = 'flex';
            }
        }

        window.sendMessage = function() {
            const textarea = document.getElementById('message-input');
            const text = textarea.value;
            if (text.trim() !== "") {
                const msgData = { sender: currentUsername, message: text, time: Date.now(), likes: 0, dislikes: 0 };
                
                if (activeReplyId) {
                    msgData.replyTo = activeReplyId;
                    msgData.replyText = activeReplyText;
                }

                push(ref(db, 'global_chat'), msgData);
                textarea.value = "";
                handleInput(textarea);
                cancelReply();
            }
        }

        window.setReply = function(key, sender, text) {
            activeReplyId = key;
            activeReplyText = text.substring(0, 40) + (text.length > 40 ? "..." : "");
            document.getElementById('reply-preview-text').innerText = `Reply to ${sender}: ${activeReplyText}`;
            document.getElementById('reply-preview-bar').style.display = 'flex';
        }

        window.cancelReply = function() {
            activeReplyId = null;
            activeReplyText = "";
            document.getElementById('reply-preview-bar').style.display = 'none';
        }

        window.likeMsg = function(key, current) { update(ref(db, 'global_chat/' + key), { likes: (current || 0) + 1 }); }
        window.dislikeMsg = function(key, current) { update(ref(db, 'global_chat/' + key), { dislikes: (current || 0) + 1 }); }

        window.deleteMsg = function(key, elementId) {
            if(confirm("Ushbu xabarni o'chirasizmi?")) {
                const el = document.getElementById(elementId);
                if(el) {
                    el.style.opacity = '0';
                    el.style.transform = 'translateY(-15px) scale(0.9)';
                    setTimeout(() => { remove(ref(db, 'global_chat/' + key)); }, 250);
                } else {
                    remove(ref(db, 'global_chat/' + key));
                }
            }
        }

        /* 🔒 YANGILANGAN PAROLLI TOZALASH FUNKSIYASI */
        window.clearAllMessages = function() {
            if(confirm("DIQQAT: Hamma xabarlarni butunlay o'chirib, chatni demoqchimisiz?")) {
                const password = prompt("Tozalash uchun maxsus parolni kiriting:");
                if(password === CLEAR_CODE) { // Bu yerda endi 3102 tekshiriladi
                    remove(ref(db, 'global_chat')).then(() => {
                        alert("Baza muvaffaqiyatli tozalandi!");
                    });
                } else {
                    alert("Noto'g'ri parol! Tozalash rad etildi.");
                }
            }
        }

        window.toggleRecording = async function() {
            const btn = document.getElementById('rec-btn');
            const statusLabel = document.getElementById('voice-status');
            
            if (!mediaRecorder || mediaRecorder.state === "inactive") {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    
                    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
                    
                    mediaRecorder.onstop = () => {
                        const blob = new Blob(audioChunks, { type: 'audio/mp3' });
                        const reader = new FileReader();
                        reader.readAsDataURL(blob);
                        reader.onloadend = () => {
                            push(ref(db, 'global_chat'), { sender: currentUsername, message: "AUDIO_BASE64:" + reader.result, time: Date.now() });
                        };
                        stream.getTracks().forEach(track => track.stop());
                    };
                    
                    mediaRecorder.start();
                    btn.classList.add('recording');
                    btn.innerHTML = "🛑";
                    statusLabel.style.display = 'block';
                } catch (err) {
                    alert("Mikrofonga ruxsat berilmadi!");
                }
            } else {
                mediaRecorder.stop();
                btn.classList.remove('recording');
                btn.innerHTML = "🎙️";
                statusLabel.style.display = 'none';
            }
        }

        function formatMessage(text) {
            if (text.startsWith('AUDIO_BASE64:')) {
                return `<audio src="${text.replace('AUDIO_BASE64:', '')}" controls></audio>`;
            }
            return text.replace(/\n/g, '<br>');
        }

        function loadMessages() {
            let initial = true;
            onValue(ref(db, 'global_chat'), (snapshot) => {
                const chatBox = document.getElementById('chat-box');
                chatBox.innerHTML = "";
                
                snapshot.forEach((child) => {
                    const key = child.key;
                    const val = child.val();
                    const elementId = "msg-" + key;
                    
                    const msgDiv = document.createElement('div');
                    msgDiv.id = elementId;
                    const isMe = (val.sender === currentUsername);
                    msgDiv.className = isMe ? 'msg my-msg' : 'msg';
                    
                    let replyMarkup = "";
                    if (val.replyTo) {
                        replyMarkup = `<div class="reply-in-msg">💬 ${val.replyText}</div>`;
                    }

                    const likeText = val.likes ? `❤️ ${val.likes}` : '❤️ Like';
                    const dislikeText = val.dislikes ? `👎 ${val.dislikes}` : '👎 Dislike';
                    const delMarkup = isMe ? `<button class="tool-btn del-btn" onclick="deleteMsg('${key}', '${elementId}')">O'chirish</button>` : '';

                    let textClean = val.message.startsWith('AUDIO_BASE64:') ? "[Ovozli xabar]" : val.message;

                    msgDiv.innerHTML = `
                        ${replyMarkup}
                        <b>${val.sender}</b>
                        <div>${formatMessage(val.message)}</div>
                        <div class="msg-tools">
                            <button class="tool-btn" onclick="likeMsg('${key}', ${val.likes || 0})">${likeText}</button>
                            <button class="tool-btn" onclick="dislikeMsg('${key}', ${val.dislikes || 0})">${dislikeText}</button>
                            <button class="tool-btn" onclick="setReply('${key}', '${val.sender}', '${textClean}')">💬 Reply</button>
                            ${delMarkup}
                        </div>
                    `;
                    chatBox.appendChild(msgDiv);
                });
                
                chatBox.scrollTop = chatBox.scrollHeight;
                if (!initial && snapshot.exists()) notificationSound.play().catch(()=>{});
                initial = false;
            });
        }
    </script>
</body>
</html>
